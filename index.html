<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motion Graphics API</title>
    <link rel="stylesheet" href="src/style.css">

    <script src="gif-js/gif.js"></script>
    <script type="module" src="src/modules/ResizableWindow.js"></script>
    <script type="module" src="src/script.js"></script>
</head>

<body>
    <div id="toolbar" tabindex="-1">
        <div class="dropdown">
            <p>File</p>
            <ul>
                <li>Import</li>
                <li>Export</li>
            </ul>
        </div>
        
        <div class="dropdown">
            <p>Edit</p>
            <ul>
                <li>uhhh</li>
            </ul>
        </div>

        <div class="dropdown">
            <p>View</p>
            <ul>
                
            </ul>
        </div>

        <div class="dropdown">
            <p>Canvas</p>
            <ul>
                
            </ul>
        </div>
    </div>



    <resizable-window id="main" resize="horizontal" split="75%" min-split="60%" max-split="90%" resizable-area-length="10">

        <!-- Left half -->
        <resizable-window resize="vertical" split="70%" min-split="50%" max-split="85%">

            <!-- Top area -->
            <resizable-window resize="horizontal" split="25%" min-split="15%" max-split="50%">

                <!-- Tools & options area -->
                <resizable-window id="tools-container" resize="vertical" split="50%" min-split="calc(100% * (1/3))" max-split="calc(100% * (2/3))">

                    <!-- Tools and shapes -->
                    <resizable-window id="tools">
                        <p>Tools</p>
                        <div>
                            <abbr title="Blank">
                                <img draggable="false" src="tool-sprites/basic-node.webp" />
                            </abbr>
                            <abbr title="Rectangle">
                                <img draggable="false" src="tool-sprites/rect-node.webp" />
                            </abbr>
                            <abbr title="Filter">
                                <img draggable="false" src="tool-sprites/filter-node.webp" />
                            </abbr>
                        </div>
                    </resizable-window>

                    <!-- Options -->
                    <resizable-window id="tool-options">
                        <p>Tool Options</p>
                        <div>

                        </div>
                    </resizable-window>

                </resizable-window>

                <!-- Preview -->
                <resizable-window id="preview-container"></resizable-window>
                
            </resizable-window>

            <!-- Timeline -->
            <resizable-window id="timeline-container"></resizable-window>

        </resizable-window>

        <!-- Right half -->
        <resizable-window resize="vertical" split="25%" min-split="10%" max-split="calc(100% / 3)">

            <!-- Top -->
            <resizable-window id="menu-options" resize="vertical">
                <p>Menu Options</p>
                <div>

                </div>
            </resizable-window>
            
            <resizable-window resize="vertical" split="calc(100% * (2/5))" min-split="calc(100% * (1/5))" max-split="calc(100% * (4/5))">

                <!-- Middle -->
                <resizable-window id="raw-node-container">
                    <p>Raw Node</p>
                    <div>

                    </div>
                </resizable-window>

                <!-- Bottom -->
                <resizable-window id="node-hierarchy">
                    <p>Node Hierarchy</p>
                    <div>
                        
                    </div>
                </resizable-window>

            </resizable-window>

        </resizable-window>

    </resizable-window>
</body>
</html>
